  #q{transform-box:fill-box;transform-origin:50% 100%}
  .controls button{
    font:inherit;font-size:14px;border:1.5px solid var(--purple);background:#fff;color:var(--purple);
    border-radius:999px;padding:6px 14px;cursor:pointer;

</style>

<script>
  // One clock at 25 fps drives every layer so they move as a single piece.
  // "Due": entrance once (20 frames), then the bounce loop (75 frames). The entrance lands
  // closest to bounce frame 50, so the loop continues from there.
  // The bounce steps on a beat (about every 4 frames); the scribble steps on the same beats
  // through 10 poses that loop without a seam. The scribble also pops in with the entrance.
  const FRAME_MS = 40, ENTR_N = 20, BOUNCE_N = 75, BOUNCE_START = 50, POSES = 10, K_DUR = 320;
  const BEATS = new Set([0, 5, 9, 13, 17, 21, 25, 30, 34, 38, 42, 46, 50, 55, 59, 63, 67, 71]);
  function bounceAt(f){ return (BOUNCE_START + f - ENTR_N) % BOUNCE_N; }
  function isBeat(f){ return f < ENTR_N ? f % 4 === 0 : BEATS.has(bounceAt(f)); }
  const kish = document.getElementById('kish'), due = document.getElementById('due');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // The question mark is part of the logo animation: it stays hidden while "Due" flies in,
  // then pops in as "Due" lands, so nothing sweeps across it.
  const q = document.getElementById('q'), Q_DELAY = 560, Q_DUR = 360;
  let t0 = 0, raf = 0, qDone = false, kDone = false, lastF = -1, beatN = -1;
  function easeOutBack(p){ const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }

  function put(el, i, w, h, cols){
    el.style.backgroundPosition = (-(i % cols) * w) + 'px ' + (-Math.floor(i / cols) * h) + 'px';
  }
  function tick(now){
    const t = now - t0, f = Math.floor(t / FRAME_MS);
    while (lastF < f) { lastF++; if (isBeat(lastF)) beatN++; }
    put(kish, beatN % POSES, 208, 102, 5);
    put(due, f < ENTR_N ? f : ENTR_N + bounceAt(f), 251, 73, 10);
    if (!kDone) {
      const p = Math.min(1, t / K_DUR);
      kish.style.opacity = Math.min(1, p * 4);
      kish.style.transform = p >= 1 ? 'none' : 'scale(' + (0.8 + 0.2 * easeOutBack(p)) + ') rotate(' + (-4 * (1 - p)) + 'deg)';
      kDone = p >= 1;
    }
    if (!qDone) {
      const p = Math.min(1, Math.max(0, (now - t0 - Q_DELAY) / Q_DUR));
      q.style.opacity = Math.min(1, p * 3);
      q.style.transform = p >= 1 ? 'none' : 'scale(' + (0.35 + 0.65 * easeOutBack(p)) + ') rotate(' + (-12 * (1 - p)) + 'deg)';
      qDone = p >= 1;
    }
    raf = requestAnimationFrame(tick);
  }
  function start(){
    cancelAnimationFrame(raf);
    if (reduce) {
      put(kish, 0, 208, 102, 5); put(due, ENTR_N + BOUNCE_START, 251, 73, 10);
      kish.style.opacity = 1; q.style.opacity = 1; return;
    }
    q.style.opacity = 0; q.style.transform = 'none'; qDone = false;
    kish.style.opacity = 0; kish.style.transform = 'none'; kDone = false;
    lastF = -1; beatN = -1;
    t0 = performance.now();
    raf = requestAnimationFrame(tick);
  }

  function fit(){
    const k = Math.min(1, (innerWidth - 32) / 390, (innerHeight - 100) / 844);
    document.getElementById('fit').style.transform = 'scale(' + k + ')';
    const b = document.getElementById('fitbox');
    b.style.width = 390 * k + 'px';
    b.style.height = 844 * k + 'px';
  }
  addEventListener('resize', fit);
  fit();

  document.getElementById('replay').addEventListener('click', start);
  addEventListener('message', function(e){ if (e.data === 'replay') start(); });

  // Wait for both sprite sheets so the entrance is not missed.
  let ready = 0;
  ['kish.webp', 'due.webp'].forEach(function(src){
    const im = new Image();
    im.onload = im.onerror = function(){ if (++ready === 2) start(); };
    im.src = src;
  });
</script>
</body>
</html>
